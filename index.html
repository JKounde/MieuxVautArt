<!DOCTYPE html>
<!--
  ================================================================
  ACCUEIL + CATALOGUE D'ART42 — la page du QR code de l'entrée
  ================================================================
  - En haut : le plan, avec une pastille numérotée sur chaque œuvre.
  - En dessous : la liste des œuvres, rangée par zone (même numéro que sur le plan).
  - Un clic sur une pastille ou une œuvre → sa fiche (fiche.html?oeuvre=…).
  Tout vient de oeuvres.js : pour ajouter une œuvre, on ajoute une ligne là-bas.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MieuxVautArt — Les œuvres d'Art42</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #f5f5f5; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }

    h1 { font-size: 1.6rem; margin: 0; }
    h1 span { color: #ff3d7f; }
    .intro { color: #aaa; margin: 4px 0 18px; }

    /* ---------- LE PLAN ----------
       .plan est le repère (position: relative) ;
       chaque pastille est placée dedans en % (position: absolute). */
    .plan { position: relative; width: 100%; aspect-ratio: 4 / 3;
            background: #1c1c1c; border: 1px solid #333; border-radius: 14px; overflow: hidden; }
    .plan svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    .pastille { position: absolute; transform: translate(-50%, -50%);   /* centre la pastille sur le point */
                width: 30px; height: 30px; border-radius: 50%; background: #ff3d7f; color: #fff;
                font-weight: 700; font-size: .9rem; display: flex; align-items: center; justify-content: center;
                text-decoration: none; border: 3px solid #fff; }
    .pastille.vide { background: #555; }   /* œuvre sans contenu pour l'instant */

    /* ---------- LA LISTE ---------- */
    h2 { font-size: .85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin: 26px 0 6px; }
    .oeuvre { display: flex; gap: 12px; align-items: center; padding: 10px 0;
              border-bottom: 1px solid #2a2a2a; color: inherit; text-decoration: none; }
    .num { width: 28px; height: 28px; border-radius: 50%; background: #ff3d7f; color: #fff; font-weight: 700;
           font-size: .85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .oeuvre.vide .num { background: #555; }
    .vignette { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center; color: #555; font-size: 1.3rem; }
    .titre { font-weight: 700; }
    .meta { color: #aaa; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>MieuxVaut<span>Art</span> · Art42</h1>
    <p class="intro">Touchez une pastille ou une œuvre pour l'écouter 🎧</p>

    <!-- Le plan : un dessin de test en SVG.
         ✏️ Pour un vrai plan : remplacez le <svg> par <img src="plan.png" alt="Plan d'Art42" style="width:100%;height:100%;object-fit:contain;position:absolute;inset:0;">
         et réglez x / y de chaque œuvre dans oeuvres.js. -->
    <div class="plan" id="plan">
      <svg viewBox="0 0 400 300" aria-hidden="true">
        <line x1="0" y1="150" x2="320" y2="150" stroke="#444" stroke-dasharray="6 6"/>
        <text x="12" y="22" fill="#777" font-size="13">1er étage</text>
        <text x="12" y="172" fill="#777" font-size="13">Rez-de-chaussée</text>
        <rect x="325" y="20" width="62" height="260" rx="6" fill="none" stroke="#555"/>
        <text x="356" y="150" fill="#777" font-size="12" text-anchor="middle" transform="rotate(-90 356 150)">Escalier Bault</text>
        <text x="12" y="285" fill="#aaa" font-size="12">📍 Entrée</text>
      </svg>
    </div>

    <div id="liste"></div>
  </main>

  <script type="module">
    import { OEUVRES, ZONES } from './oeuvres.js';

    // Une œuvre "a du contenu" si elle a au moins une image, un audio ou une vidéo
    const aDuContenu = (o) => Boolean(o.image || o.video || Object.keys(o.audio || {}).length);

    // 1. LES PASTILLES SUR LE PLAN (numéro = position dans la liste + 1)
    const plan = document.getElementById('plan');
    OEUVRES.forEach((o, i) => {
      const a = document.createElement('a');
      a.className = 'pastille' + (aDuContenu(o) ? '' : ' vide');
      a.href = `fiche.html?oeuvre=${o.id}`;
      a.style.left = o.x + '%';          // position horizontale en %
      a.style.top = o.y + '%';           // position verticale en %
      a.textContent = i + 1;
      a.setAttribute('aria-label', `${i + 1}. ${o.titre}`);
      plan.appendChild(a);
    });

    // 2. LA LISTE, RANGÉE PAR ZONE
    const liste = document.getElementById('liste');
    // Les zones connues d'abord (dans l'ordre de ZONES), puis les éventuelles autres
    const zones = [...ZONES, ...new Set(OEUVRES.map((o) => o.zone).filter((z) => !ZONES.includes(z)))];

    for (const zone of zones) {
      const dansLaZone = OEUVRES.filter((o) => o.zone === zone);
      if (!dansLaZone.length) continue;

      const titre = document.createElement('h2');
      titre.textContent = zone;
      liste.appendChild(titre);

      for (const o of dansLaZone) {
        const numero = OEUVRES.indexOf(o) + 1;   // le même numéro que sur le plan
        const vignette = o.image
          ? `<img class="vignette" src="${o.image}" alt="">`
          : `<div class="vignette">🖼️</div>`;
        const medias = [o.audio && Object.keys(o.audio).length ? 'audio' : '', o.video ? 'vidéo' : '', o.videoRA ? 'RA' : '']
          .filter(Boolean).join(' · ') || 'bientôt';

        const lien = document.createElement('a');
        lien.className = 'oeuvre' + (aDuContenu(o) ? '' : ' vide');
        lien.href = `fiche.html?oeuvre=${o.id}`;
        lien.innerHTML = `
          <span class="num">${numero}</span>
          ${vignette}
          <div>
            <div class="titre">${o.titre}</div>
            <div class="meta">${o.artiste} · ${medias}</div>
          </div>`;
        liste.appendChild(lien);
      }
    }
  </script>
</body>
</html>
