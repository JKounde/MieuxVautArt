<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="system-ui, sans-serif">
  <!-- Plan simplifié du niveau R+4 de 42 (redessiné d'après le plan d'évacuation) -->
  <!-- Fond du bâtiment -->
  <rect x="8" y="8" width="384" height="184" rx="4" fill="#1c1c1c" stroke="#666" stroke-width="2"/>

  <!-- Noyau ouest : escalier + ascenseur -->
  <rect x="40" y="28" width="46" height="112" fill="#2a2a2a" stroke="#777" stroke-width="1.5"/>
  <g stroke="#555" stroke-width="1">
    <line x1="44" y1="48" x2="82" y2="48"/><line x1="44" y1="56" x2="82" y2="56"/>
    <line x1="44" y1="64" x2="82" y2="64"/><line x1="44" y1="72" x2="82" y2="72"/>
    <line x1="44" y1="80" x2="82" y2="80"/><line x1="44" y1="88" x2="82" y2="88"/>
    <line x1="44" y1="96" x2="82" y2="96"/><line x1="44" y1="104" x2="82" y2="104"/>
    <line x1="63" y1="44" x2="63" y2="112"/>
  </g>
  <rect x="40" y="140" width="22" height="22" fill="#2a2a2a" stroke="#777" stroke-width="1.5"/>
  <rect x="62" y="140" width="24" height="22" fill="#2a2a2a" stroke="#777" stroke-width="1.5"/>
  <text x="74" y="155" fill="#999" font-size="8" text-anchor="middle">ASC</text>
  <text x="63" y="24" fill="#aaa" font-size="9" text-anchor="middle">Escalier ouest</text>

  <!-- Salles de travail -->
  <rect x="100" y="28" width="92" height="134" rx="3" fill="#242424" stroke="#444"/>
  <text x="146" y="99" fill="#888" font-size="10" text-anchor="middle">Salle de travail</text>
  <rect x="204" y="28" width="92" height="134" rx="3" fill="#242424" stroke="#444"/>
  <text x="250" y="99" fill="#888" font-size="10" text-anchor="middle">Salle de travail</text>

  <!-- Noyau est : ascenseur + escalier + sanitaires -->
  <rect x="312" y="28" width="26" height="22" fill="#2a2a2a" stroke="#777" stroke-width="1.5"/>
  <text x="325" y="43" fill="#999" font-size="8" text-anchor="middle">ASC</text>
  <rect x="312" y="56" width="34" height="106" fill="#2a2a2a" stroke="#777" stroke-width="1.5"/>
  <g stroke="#555" stroke-width="1">
    <line x1="315" y1="76" x2="343" y2="76"/><line x1="315" y1="84" x2="343" y2="84"/>
    <line x1="315" y1="92" x2="343" y2="92"/><line x1="315" y1="100" x2="343" y2="100"/>
    <line x1="315" y1="108" x2="343" y2="108"/><line x1="315" y1="116" x2="343" y2="116"/>
    <line x1="315" y1="124" x2="343" y2="124"/><line x1="315" y1="132" x2="343" y2="132"/>
    <line x1="329" y1="72" x2="329" y2="140"/>
  </g>
  <rect x="348" y="28" width="26" height="134" fill="#262626" stroke="#555"/>
  <text x="361" y="99" fill="#888" font-size="8" text-anchor="middle" transform="rotate(-90 361 99)">Sanitaires</text>
  <text x="329" y="176" fill="#aaa" font-size="9" text-anchor="middle">Escalier est</text>

  <!-- Niveau -->
  <text x="200" y="184" fill="#777" font-size="9" text-anchor="middle">Niveau R+4</text>
</svg>
